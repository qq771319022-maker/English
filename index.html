<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="Daily English + Data Center Engineering English">
<link rel="manifest" href="manifest.webmanifest">
<title>DC Engineer English</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#111827;color:white;padding:14px 16px calc(12px + env(safe-area-inset-top));box-shadow:0 2px 10px #0002}
h1{font-size:20px;margin:0 0 10px}.sub{font-size:12px;opacity:.75}
main{max-width:760px;margin:auto;padding:14px 14px 90px}.hero{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f9fafb;border-radius:12px;padding:10px;text-align:center}.num{font-size:22px;font-weight:700}.label{font-size:11px;color:var(--muted)}
.search{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:white;outline:none}
.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;white-space:nowrap}.tab.active{background:#111827;color:white}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.word{font-size:18px;font-weight:750}.meaning{margin-top:3px;color:var(--muted)}.example{margin-top:9px;line-height:1.45}.small{font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer}.play{border:0;background:#eff6ff;color:#1d4ed8;border-radius:12px;padding:10px 12px}.primary{border:0;background:#111827;color:white;border-radius:12px;padding:10px 14px}.outline{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px calc(8px + env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));z-index:6}.bottom button{flex:1;max-width:180px;border:0;background:white;padding:8px 4px;color:var(--muted)}.bottom button.active{color:#111827;font-weight:700}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}.sheet{background:white;border-radius:22px 22px 0 0;width:100%;max-height:88vh;overflow:auto;padding:20px 16px calc(25px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pill{display:inline-block;padding:4px 8px;background:#f3f4f6;border-radius:999px;font-size:11px;color:#4b5563}
progress{width:100%;height:9px}.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><h1>DC Engineer English</h1><div class="sub">Daily English · Data Center · Electrical · MOP/SOP/RCA · Troubleshooting</div></header>
<main id="app"></main>
<nav class="bottom">
<button id="navHome" onclick="go('home')">🏠<br>首页</button>
<button id="navDaily" onclick="go('daily')">📚<br>日常</button>
<button id="navPro" onclick="go('pro')">⚡<br>专业</button>
<button id="navReview" onclick="go('review')">🔄<br>复习</button>
</nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
let data=[], route='home', q='', filter='all', review=[];
const state=JSON.parse(localStorage.getItem('dceng_state')||'{"learned":[],"favorites":[],"review":[]}');
const save=()=>localStorage.setItem('dceng_state',JSON.stringify(state));
async function init(){data=(await fetch('data/vocab.json').then(r=>r.json())).entries;render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t,rate=.82,lang='en-US'){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate;u.pitch=1;speechSynthesis.speak(u)}
function go(r){route=r;render();scrollTo(0,0)}
function markLearned(id){if(!state.learned.includes(id))state.learned.push(id);save();render()}
function fav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()}
function list(cat){
 let arr=data;
 if(cat==='daily')arr=data.filter(x=>x.category==='Daily & Work English');
 if(cat==='pro')arr=data.filter(x=>x.category.includes('Engineering')||x.category==='Scenario');
 if(cat==='review')arr=data.filter(x=>state.favorites.includes(x.id)||state.learned.includes(x.id));
 if(q)arr=arr.filter(x=>(x.word+' '+x.meaning_zh+' '+x.example_en).toLowerCase().includes(q.toLowerCase()));
 return arr;
}
function card(x){let isFav=state.favorites.includes(x.id);return `<div class="card"><div class="row"><div class="grow" onclick="detail(${x.id})"><div class="word">${esc(x.word)}</div><div class="meaning">${esc(x.meaning_zh)}</div></div><button class="play" onclick="speak(${JSON.stringify(x.word)})">🔊</button></div><div class="example">${esc(x.example_en)}</div><div class="small">${esc(x.example_zh)}</div><div style="margin-top:8px"><span class="pill">${esc(x.category)}</span>${isFav?' <span class="pill">⭐ 收藏</span>':''}</div></div>`}
function header(title,desc){return `<div class="hero"><h2 style="margin:0 0 5px">${title}</h2><div class="small">${desc}</div></div><input class="search" placeholder="搜索英文 / 中文 / 例句" value="${esc(q)}" oninput="q=this.value;renderList()">`}
function render(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));document.getElementById('nav'+({home:'Home',daily:'Daily',pro:'Pro',review:'Review'}[route])).classList.add('active');if(route==='home')home();else if(route==='daily')page('daily','Daily English','日常 + 工作沟通，先把高频表达练熟。');else if(route==='pro')page('pro','Data Center & Electrical','MV/LV · UPS · Generator · Transformer · MOP/SOP/RCA · Troubleshooting');else page('review','Review','收藏与已学习内容，用于快速复习。')}
function home(){document.getElementById('app').innerHTML=`<div class="hero"><h2 style="margin:0">今天学一点，现场用得上。</h2><p class="small">不是背孤立单词，而是把单词、例句、连读和工程场景一起练。</p><div class="stats"><div class="stat"><div class="num">${data.length}</div><div class="label">学习内容</div></div><div class="stat"><div class="num">${state.learned.length}</div><div class="label">已学习</div></div><div class="stat"><div class="num">${state.favorites.length}</div><div class="label">收藏</div></div></div><div style="margin-top:12px"><progress value="${state.learned.length}" max="${data.length}"></progress></div></div>
<div class="hero"><h3 style="margin-top:0">快速入口</h3><div class="actions"><button class="primary" onclick="go('daily')">📚 日常英语</button><button class="primary" onclick="go('pro')">⚡ 专业英语</button><button class="outline" onclick="go('review')">🔄 开始复习</button></div></div>
<div class="hero"><h3 style="margin-top:0">今日推荐</h3>${data.slice(Math.floor(Math.random()*Math.max(1,data.length-3)),Math.floor(Math.random()*Math.max(1,data.length-3))+3).map(card).join('')}</div>`}
function page(cat,title,desc){document.getElementById('app').innerHTML=header(title,desc)+'<div id="list"></div>';renderList()}
function renderList(){let el=document.getElementById('list');if(!el)return;let arr=list(route);el.innerHTML=arr.length?arr.slice(0,100).map(card).join(''):`<div class="empty">没有找到相关内容</div>`}
function detail(id){let x=data.find(a=>a.id===id);if(!x)return;document.getElementById('sheet').innerHTML=`<div class="row"><div class="grow"><h2 style="margin:0">${esc(x.word)}</h2><div class="small">${esc(x.phonetic)} · ${esc(x.pos)}</div></div><button class="play" onclick="speak(${JSON.stringify(x.word)})">🔊</button></div><p><b>${esc(x.meaning_zh)}</b></p>${x.root?`<p><b>词根/词缀：</b>${esc(x.root)}</p>`:''}<p><b>搭配：</b>${(x.collocations||[]).map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}</p><p><b>工程/日常例句：</b><br>${esc(x.example_en)}</p><p class="small">${esc(x.example_zh)}</p><p><b>连读：</b>${esc(x.connected_speech)}</p><div class="actions"><button class="primary" onclick="speak(${JSON.stringify(x.word)})">单词</button><button class="primary" onclick="speak(${JSON.stringify(x.example_en)})">例句</button><button class="outline" onclick="speak(${JSON.stringify(x.example_en)},.55)">慢速</button><button class="outline" onclick="speak(${JSON.stringify(x.example_en)},.82,'en-GB')">英音</button><button class="outline" onclick="fav(${x.id});detail(${x.id})">${state.favorites.includes(x.id)?'取消收藏':'⭐ 收藏'}</button><button class="outline" onclick="markLearned(${x.id});detail(${x.id})">✓ 已学习</button></div>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
init();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#eaf4ff" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>DC Engineer English</title>
<style>
*{box-sizing:border-box}
html{color-scheme:light;background:#eaf4ff}
body{color-scheme:light}
body{margin:0;background:#f3f6fa;color:#132238;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(180deg,#eaf4ff 0%,#f7fbff 100%);color:#132238;padding:20px 18px 17px}
header h1{margin:0;font-size:27px}
header p{margin:5px 0 0;color:#62809b}
main{max-width:980px;margin:auto;padding:14px 16px 112px}
.search{width:100%;padding:14px 15px;border:1px solid #d8dee8;border-radius:15px;font-size:16px;margin-bottom:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:13px 5px;text-align:center;box-shadow:0 2px 8px #3b82f610}
.stat b{display:block;font-size:22px;color:#1d4ed8}.stat span{font-size:11px;color:#64748b}
.progress{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:14px;margin-bottom:12px}
.progressline{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.bar{height:10px;background:#e8edf3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}
.tabs button,.tools button{border:1px solid #d8dee8;background:#fff;border-radius:11px;padding:9px 12px;font-size:14px;white-space:nowrap}
.tabs button.active{background:#2563eb;color:#fff}
.card{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #00000008}
.top{display:flex;justify-content:space-between;gap:10px}.word{font-size:23px;font-weight:750}
.cn{font-size:17px;color:#64748b;margin-top:2px}.ex{font-size:16px;margin-top:10px;line-height:1.5}.tr{color:#64748b;font-size:13px}
.tag{display:inline-block;margin-top:9px;padding:4px 8px;background:#f1f5f9;border-radius:999px;font-size:11px;color:#475569}
.speak{width:46px;height:46px;border:0;border-radius:13px;background:#eef6ff;font-size:21px;flex:0 0 auto}
.panel{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:13px;margin-bottom:12px}
.install{width:100%;border:0;border-radius:12px;padding:12px;background:#2563eb;color:#fff;font-size:14px;margin-top:10px}.install.hidden{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid #dbe1ea;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 6px calc(10px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -4px 16px #64748b12}
.bottom button{background:none;border:0;padding:5px 2px;font-size:15px;color:#64748b;min-width:0}.bottom .ico{font-size:26px;line-height:27px}.bottom button.active{color:#2563eb;font-weight:750}.bottom button.active .ico{filter:saturate(1.15)}
.hero{background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 5px}.hero p{margin:5px 0;color:#64748b}
.cta{width:100%;border:0;border-radius:13px;cursor:pointer;touch-action:manipulation;padding:13px;background:#2563eb;color:#fff;font-size:15px;margin-top:9px}
.cta.blue{background:#2563eb}.cta.secondary{background:#eef2f7;color:#111827}
.taskgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.task{background:#f8fafc;border-radius:14px;padding:10px;text-align:center}.task b{font-size:20px;display:block}.task span{font-size:11px;color:#64748b}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:11px;margin-top:5px}
.done{background:#ecfdf5;color:#047857}.duebadge{background:#fff7ed;color:#c2410c}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:100;overscroll-behavior:contain}.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:21px 21px 0 0;padding:20px 20px calc(44px + env(safe-area-inset-bottom));box-sizing:border-box}
.close{float:right;border:0;background:#f1f5f9;border-radius:9px;padding:7px 11px}
.completion{position:static;display:block;width:100%;margin:18px 0 4px;padding:12px;background:#fff;border:1px solid #dbe5f0;border-radius:16px;box-shadow:0 4px 16px rgba(15,23,42,.10)}
.completion b{display:inline;font-size:14px;color:#132238;padding:0}.completion span{display:inline;margin-left:7px;font-size:11px;color:#64748b;padding:0}
.rating{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:11px}
.rating button{border:1px solid #cbd5e1;background:#fff;border-radius:11px;padding:8px 5px;font-size:11px;min-height:46px;cursor:pointer;touch-action:manipulation}
.rating button:active{transform:scale(.98);background:#eff6ff}.rating button b{color:#132238}
.rating b{display:block;font-size:14px;margin-bottom:1px}
.rating b{display:block;font-size:15px;margin-bottom:2px}
.flash{background:#f8fafc;border-radius:15px;padding:18px;margin-top:12px;text-align:center}.flash .big{font-size:28px;font-weight:750}
.small{font-size:12px;color:#64748b}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f4}
.setting:last-child{border-bottom:0}.setting b{display:block}.setting span{font-size:12px;color:#64748b}.setting select{padding:9px;border:1px solid #d8dee8;border-radius:10px;background:#fff}
.status{padding:9px 11px;background:#f8fafc;border-radius:11px;margin-top:9px;font-size:12px;line-height:1.45}
@media(min-width:700px){.modal{align-items:center;justify-content:center}.sheet{max-width:680px;padding-bottom:28px}.completion{width:100%;border-radius:16px}}

.homeHero{background:linear-gradient(135deg,#f8fbff 0%,#eef6ff 100%);border:1px solid #dce8f5;border-radius:24px;padding:18px;margin-bottom:13px;box-shadow:0 8px 24px rgba(37,99,235,.07)}
.homeTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.homeTitle{font-size:27px;font-weight:800;margin:0;color:#10233f}.homeSub{color:#6b7f95;font-size:13px;margin-top:4px}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(#2563eb var(--pct),#dbeafe 0);display:grid;place-items:center;flex:0 0 auto}
.ring:after{content:'';width:62px;height:62px;border-radius:50%;background:#fff}.ringText{position:absolute;font-weight:800;color:#132238;font-size:15px}
.homeTasks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0 12px}.homeTask{background:#fff;border-radius:15px;padding:10px 6px;text-align:center;border:1px solid #e3ebf5}.homeTask b{display:block;font-size:18px;color:#1d4ed8}.homeTask span{font-size:10px;color:#64748b}
.homeCta{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:15px;padding:14px 16px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;box-shadow:0 7px 16px rgba(37,99,235,.2)}
.sectionTitle{font-size:18px;font-weight:800;margin:15px 2px 8px}.quoteBox{background:#eef6ff;border-radius:18px;padding:18px;text-align:center;color:#53708e;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<header><h1>DC Engineer English</h1><p>日常英语 + 数据中心工程英语 · V42</p><div class="brandline">LEARN&nbsp;&nbsp; PRACTICE&nbsp;&nbsp; IMPROVE</div><div class="slogan">完全本地词库 · 快速学习 · 无需在线查词</div></header>
<main id="main"></main>
<nav class="bottom">
<button data-nav="home" class="active"><div class="ico">🏠</div>首页</button>
<button data-nav="daily"><div class="ico">📚</div>日常</button>
<button data-nav="professional"><div class="ico">⚡</div>专业</button>
<button data-nav="review"><div class="ico">🔄</div>复习</button>
<button data-nav="mine"><div class="ico">👤</div>我的</button>
</nav>
<div id="modal" class="modal"><div class="sheet"><button class="close" id="closeBtn">关闭</button><div id="detail"></div></div></div>

<script>
let items=[],page='home',query='',audioEl=null,deferredInstallPrompt=null,todayFilter='all';
const KEY='dceng_v9_progress';
const LOCAL_AUDIO_BASE='./audio/';
const LOCAL_EXAMPLE_BASE='./example_audio/';
function audioSlug(w){return String(w).toLowerCase().replace(/[^a-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'');}
const progress=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('dceng_v8_progress')||localStorage.getItem('dceng_v6_progress')||'{}');
if(localStorage.getItem('dceng_dict_cache_version')!=='43'){localStorage.removeItem('dceng_dict_cache_v21');localStorage.setItem('dceng_dict_cache_version','43');}
const favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]'));

function $id(x){return document.getElementById(x)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem('favs',JSON.stringify([...favs]))}
function today(){return new Date().toLocaleDateString('en-CA')}
function st(w){return progress[w]||{box:0,due:0,seen:0,correct:0,wrong:0,last:0}}
function isPro(x){return x.category==='Data Center & Electrical Engineering'||x.category==='Engineering Phrases'||x.category==='Scenario'}
function due(){return items.filter(x=>{let s=st(x.word);return s.seen>0&&s.due<=Date.now()})}
function mastered(){return items.filter(x=>st(x.word).box>=4)}
function newWords(pool=items){return pool.filter(x=>st(x.word).seen===0)}
function goals(){return{
  n:+localStorage.getItem('dceng_daily_new')||20,
  p:+localStorage.getItem('dceng_daily_pro')||10,
  r:+localStorage.getItem('dceng_review')||20
}}
function dayStats(){return JSON.parse(localStorage.getItem('dceng_daystats')||'{}')}
function setDayStats(o){localStorage.setItem('dceng_daystats',JSON.stringify(o))}
function completedToday(){return dayStats()[today()]||{n:0,p:0,r:0}}
function markToday(type,w){
  let all=dayStats(),k=today(); all[k]=all[k]||{n:0,p:0,r:0};
  all[k][type]=all[k][type]||0; all[k][type]++; setDayStats(all);
  let done=JSON.parse(localStorage.getItem('dceng_completed_today')||'{}');
  done[k]=done[k]||{}; done[k][w]=true; localStorage.setItem('dceng_completed_today',JSON.stringify(done));
}
function isCompletedToday(w){let d=JSON.parse(localStorage.getItem('dceng_completed_today')||'{}');return !!(d[today()]&&d[today()][w])}
function streak(){
  let d=JSON.parse(localStorage.getItem('dceng_days')||'{}'),n=0,dt=new Date();
  for(let i=0;i<3660;i++){let k=dt.toLocaleDateString('en-CA');if(!d[k])break;n++;dt.setDate(dt.getDate()-1)}
  return n
}
function markDay(){let d=JSON.parse(localStorage.getItem('dceng_days')||'{}');d[today()]=true;localStorage.setItem('dceng_days',JSON.stringify(d))}
function dailyPlan(){
  const g=goals(), key='dceng_plan_'+today();
  let saved=JSON.parse(localStorage.getItem(key)||'null');
  if(saved && Array.isArray(saved.ids)) return saved;
  const d=due().slice(0,g.r);
  const dueIds=new Set(d.map(x=>x.id));
  const dailyPool=newWords(items.filter(x=>!isPro(x))).filter(x=>!dueIds.has(x.id)).slice(0,g.n);
  const proPool=newWords(items.filter(isPro)).filter(x=>!dueIds.has(x.id)).slice(0,g.p);
  const plan={ids:[...d,...dailyPool,...proPool].map(x=>x.id)};
  localStorage.setItem(key,JSON.stringify(plan)); return plan;
}
function todayTasks(){
  const ids=new Set(dailyPlan().ids);
  return items.filter(x=>ids.has(x.id));
}
function todayRemaining(){return todayTasks().filter(x=>!isCompletedToday(x.word))}
function preloadTodayAudio(){
  try{
    const pool=todayTasks().slice(0,60);
    pool.forEach(x=>{
      const a=new Audio(LOCAL_AUDIO_BASE+audioSlug(x.word)+'.mp3');a.preload='auto';
      const b=new Audio(LOCAL_EXAMPLE_BASE+audioSlug(x.word)+'.mp3');b.preload='auto';
    });
  }catch(e){}
}
function todayCounts(){
  const t=completedToday(),g=goals();
  return {n:t.n,p:t.p,r:t.r,total:t.n+t.p+t.r,target:g.n+g.p+Math.min(g.r,due().length)}
}
function refreshStats(){
  let m=mastered().length,p=items.length?Math.round(m/items.length*100):0;
  $id('total')?.replaceChildren(items.length);$id('mastered')?.replaceChildren(m);
  $id('due')?.replaceChildren(due().length);$id('streak')?.replaceChildren(streak());
  $id('pct')?.replaceChildren(p+'%');if($id('bar'))$id('bar').style.width=p+'%';
}
function statusLabel(x){
  if(isCompletedToday(x.word)) return '<span class="badge done">今日已完成</span>';
  let s=st(x.word); if(s.seen===0)return '<span class="badge">新词</span>';
  if(s.due<=Date.now())return '<span class="badge duebadge">待复习</span>';
  return '<span class="badge">学习中</span>';
}
function cachedEntry(word){
  const x=items.find(a=>String(a.word).toLowerCase()===String(word).toLowerCase());
  if(!x)return null;
  return {meaning_zh:x.meaning_zh||'',pos:x.pos||'',phonetic:x.phonetic||'',example_en:x.example_en||'',example_zh:x.example_zh||'',collocations:x.collocations||[],source:'本地离线词库'};
}
function card(x,i){
  const c=cachedEntry(x.word);
  const meaning=c?.meaning_zh||x.meaning_zh||'—';
  const ex=c?.example_en||x.example_en||'—';
  const tr=c?.example_zh||x.example_zh||'';
  return `<article class="card" data-detail="${i}">
    <div class="top"><div><div class="word">${esc(x.word)}</div><div class="cn">${esc(meaning)}</div></div>
    <button class="speak" data-speak="${i}">🔊</button></div>
    <div class="ex">${esc(ex)}</div><div class="tr">${esc(tr)}</div>
    <span class="tag">${isPro(x)?'Professional Engineering':'Daily & Work English'} · ${x.quality==='offline-local'?'本地词库':x.quality} · ${statusLabel(x)}</span>
  </article>`
}
function list(arr){return arr.map(x=>card(x,items.indexOf(x))).join('')||'<div class="panel">没有符合条件的内容。</div>'}

function openToday(mode='all'){
  todayFilter = mode || 'all';
  page = 'today';
  query = '';
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderToday(mode='all'){
 const g=goals(), tasks=todayTasks();
 let pool=tasks;
 if(mode==='daily') pool=tasks.filter(x=>!isPro(x)&&st(x.word).seen===0);
 if(mode==='professional') pool=tasks.filter(x=>isPro(x)&&st(x.word).seen===0);
 if(mode==='review') pool=tasks.filter(x=>st(x.word).seen>0&&st(x.word).due<=Date.now());
 page='today';
 $id('main').innerHTML=`<div class="hero"><h2>今日学习</h2><p>固定任务 · 完成一次记忆判断才计入今日完成</p>
 <div class="taskgrid"><div class="task"><b>${completedToday().n}/${g.n}</b><span>日常新词</span></div><div class="task"><b>${completedToday().p}/${g.p}</b><span>专业新词</span></div><div class="task"><b>${completedToday().r}/${Math.min(g.r,due().length)}</b><span>到期复习</span></div></div>
 <div class="tabs"><button class="${mode==='all'?'active':''}" data-tmode="all">全部</button><button class="${mode==='daily'?'active':''}" data-tmode="daily">日常</button><button class="${mode==='professional'?'active':''}" data-tmode="professional">专业</button><button class="${mode==='review'?'active':''}" data-tmode="review">复习</button></div>
 <div id="cards">${list(pool)}</div></div>`;
 document.querySelectorAll('[data-tmode]').forEach(b=>b.onclick=()=>renderToday(b.dataset.tmode));
 document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{let x=items[+b.dataset.speak];playLocalWord(x.word)});
 document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(+b.dataset.detail));
}

function render(){
  let body='';
  if(page==='home'){
    const g=goals(), ds=completedToday(), totalToday=g.n+g.p+g.r;
    const doneToday=Math.min(totalToday, ds.n+ds.p+ds.r);
    const pct=totalToday?Math.round(doneToday/totalToday*100):0;
    const uniqueCount=new Set(items.map(x=>String(x.word||'').trim().toLowerCase())).size;
    body=`<div class="homeHero">
      <div class="homeTop">
        <div><div class="homeTitle">Good afternoon ☀️</div><div class="homeSub">每天进步一点点，今天也继续。</div></div>
        <div class="ring" style="--pct:${pct*3.6}deg"><span class="ringText">${pct}%</span></div>
      </div>
      <div class="sectionTitle" style="margin-top:16px">今日学习任务</div>
      <div class="homeTasks">
        <div class="homeTask"><b>📚 ${ds.n}/${g.n}</b><span>日常新词</span></div>
        <div class="homeTask"><b>⚡ ${ds.p}/${g.p}</b><span>专业新词</span></div>
        <div class="homeTask"><b>🔄 ${ds.r}/${g.r}</b><span>复习词</span></div>
      </div>
      <div style="text-align:center;color:#64748b;font-size:13px;margin:2px 0 12px">今日总进度 <b style="color:#132238">${doneToday}/${totalToday}</b></div>
      <button class="homeCta" type="button" onclick="openToday('all')"><span>▶ 开始今日学习</span><span>›</span></button>
    </div>
    <div class="sectionTitle">学习统计</div>
    <div class="stats">
      <div class="stat"><b>${uniqueCount}</b><span>唯一词条</span></div>
      <div class="stat"><b>${mastered().length}</b><span>已掌握</span></div>
      <div class="stat"><b>${items.filter(x=>st(x.word).seen>0&&st(x.word).box<4).length}</b><span>学习中</span></div>
      <div class="stat"><b>${due().length}</b><span>待复习</span></div>
    </div><div class="small" style="margin:-4px 2px 10px">词库校验：本地词库共 2318 条记录（其中 2316 个唯一英文词头）；全部归入“日常”或“专业”菜单。学习过程中无需在线查询。</div>
    <div class="progress"><div class="progressline"><span>总体掌握进度</span><b>${items.length?Math.round(mastered().length/items.length*100):0}%</b></div><div class="bar"><i style="width:${items.length?Math.round(mastered().length/items.length*100):0}%"></i></div></div>
    <div class="quoteBox">A little progress each day adds up to big results.<br><span>每天一点点进步，终会带来大的改变。</span></div>`;
  }else if(page==='daily'){
    const g=goals(), tasks=todayTasks(), rem=todayRemaining();
    body=`<div class="hero"><h2>日常英语</h2><p>这里是完整日常词库；今日任务会与专业英语、复习任务一起出现在“首页 → 今日学习”。</p>
      <div class="taskgrid"><div class="task"><b>${completedToday().n}/${g.n}</b><span>今日新词</span></div><div class="task"><b>${rem.length}</b><span>今日剩余</span></div><div class="task"><b>${items.filter(x=>!isPro(x)).length}</b><span>日常词库</span></div></div>
      <button type="button" class="cta blue" onclick="openToday('daily')">📚 打开今日学习</button></div>
      <input id="search" class="search" placeholder="搜索英文 / 中文 / 例句">
      <div id="cards">${list(items.filter(x=>!isPro(x)))}</div>`;
  }else if(page==='professional'){
    body=`<div class="hero"><h2>专业英语</h2><p>数据中心、电气、柴油发电机、UPS、MV/LV、测试、MOP、RCA、故障处理、维护与验收等。</p>
      <div class="taskgrid"><div class="task"><b>${completedToday().p}/${goals().p}</b><span>今日专业新词</span></div><div class="task"><b>${items.filter(isPro).length}</b><span>专业词库</span></div><div class="task"><b>${mastered().filter(isPro).length}</b><span>已掌握专业词</span></div></div>
      <button type="button" class="cta blue" onclick="openToday('professional')">⚡ 今日专业学习</button></div>
      <input id="search" class="search" placeholder="搜索专业术语 / 中文 / 例句">
      <div id="cards">${list(items.filter(isPro))}</div>`;
  }else if(page==='today'){
    renderToday(todayFilter||'all'); return;
  }else if(page==='review'){
    body=`<div class="hero"><h2>复习</h2><p>只显示已经学习并且到期的词。复习结果会自动影响下一次出现时间。</p>
      <div class="taskgrid"><div class="task"><b>${due().length}</b><span>当前待复习</span></div><div class="task"><b>${completedToday().r}</b><span>今日已复习</span></div><div class="task"><b>${goals().r}</b><span>每日上限</span></div></div>
      </div><div id="cards">${list(due())}</div>`;
  }else{
    body=`<div class="hero"><h2>我的</h2><p>学习计划、发音和 App 设置</p>
      <div class="panel">

async function clearAppCache(){
  const btn=$id('clearCacheBtn');
  if(!confirm('清除 App 缓存？\n\n学习进度、收藏、每日学习设置不会被删除。'))return;
  try{
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
    if(btn)btn.disabled=true;
    location.reload();
  }catch(e){
    if(btn)btn.disabled=false;
    alert('缓存清理失败，请稍后重试。');
  }
}

$id('main').addEventListener('click',e=>{
  let open=e.target.closest('[data-open-today]');
  if(open){openToday(open.dataset.openToday||'all');return}
  let pg=e.target.closest('[data-page]');

  let tf=e.target.closest('[data-today-filter]');

  let sp=e.target.closest('[data-speak]');

  let c=e.target.closest('[data-detail]');if(c)detail(+c.dataset.detail);
});
function playLocalAudio(path){
  return new Promise((resolve,reject)=>{
    try{
      if(audioEl){audioEl.pause();audioEl.src='';}
      audioEl=new Audio(path);
      audioEl.preload='auto'; audioEl.playsInline=true;
      audioEl.playbackRate=+(localStorage.getItem('dceng_rate')||1);
      audioEl.onended=()=>resolve(true);
      audioEl.onerror=()=>reject(new Error('audio'));
      const p=audioEl.play();
      if(p&&p.catch)p.catch(reject); else resolve(true);
    }catch(e){reject(e)}
  });
}

  catch(e){if(s)s.textContent='✕ 本地单词音频不可用';}
}

function nextMidnight(days){
  const d=new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+days);
  return d.getTime();
}
function rate(w,l){
  let x=items.find(a=>a.word===w),s=st(w),now=Date.now();
  const wasNew=s.seen===0;
  const wasDue=!wasNew && s.due<=now;
  s.seen++;s.last=now;
  if(l==='again'){s.box=0;s.wrong++;s.due=now+10*60000}
  else if(l==='hard'){s.box=Math.max(1,s.box);s.wrong++;s.due=nextMidnight(1)}
  else if(l==='good'){s.box=Math.min(4,s.box+1);s.correct++;s.due=nextMidnight(3)}
  else{s.box=4;s.correct++;s.due=nextMidnight(7)}
  progress[w]=s;save();markDay();
  if(!isCompletedToday(w)) markToday(wasDue?'r':isPro(x)?'p':'n',w);
  $id('modal').classList.remove('show');render();
}
let midnightTimer=null;
function scheduleMidnightRefresh(){
  if(midnightTimer) clearTimeout(midnightTimer);
  const now=new Date(), next=new Date(now);
  next.setHours(24,0,0,50);
  midnightTimer=setTimeout(()=>{render();scheduleMidnightRefresh()},Math.max(1000,next-now));
}
function browserSpeak(text){
  return new Promise((res,rej)=>{
    if(!('speechSynthesis'in window))return rej();
    speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);
    u.lang=localStorage.getItem('dceng_accent')||'en-US';u.rate=+(localStorage.getItem('dceng_rate')||1);
    let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));
    u.onend=()=>res();u.onerror=()=>rej();speechSynthesis.speak(u);
    setTimeout(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending)rej()},1600);
  })
}
async function speakText(t){
  // Kept only for the voice-test button; normal word/phrase playback is fully local.
  let s=$id('status'); if(s)s.textContent='正在播放系统语音…';

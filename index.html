<script>
function applySystemTheme(){
  const dark=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.style.colorScheme=dark?'dark':'light';
  const metaL=document.querySelector('meta[name="theme-color"][media*="light"]');
  const metaD=document.querySelector('meta[name="theme-color"][media*="dark"]');
  if(metaL) metaL.content='#eaf4ff';
  if(metaD) metaD.content='#191919';
}
applySystemTheme();
try{
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener?.('change',applySystemTheme);
  mq.addListener?.(applySystemTheme);
}catch(e){}
</script>

\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffd92e\"/><stop offset=\"1\" stop-color=\"#f89c16\"/></linearGradient></defs><path d=\"M9 26c0-10 7-16 15-16s15 6 15 16v7H9z\" fill=\"url(#gHard)\"/><path d=\"M8 32h32v5H8z\" fill=\"#f59b12\"/><path d=\"M24 14 18.5 25h5l-2 8L30 22h-5z\" fill=\"#fff\"/></svg></div>专业</button>\n<button data-nav=\"review\"><div class=\"ico\"><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><defs><linearGradient id=\"gRev\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#a99bff\"/><stop offset=\"1\" stop-color=\"#6552e8\"/></linearGradient></defs><rect x=\"7\" y=\"7\" width=\"34\" height=\"34\" rx=\"9\" fill=\"url(#gRev)\"/><path d=\"M13 24a11 11 0 0 1 19-7\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"m31 13 1 7-7-1\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M35 24a11 11 0 0 1-19 7\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"m17 35-1-7 7 1\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div>复习</button>\n<button data-nav=\"mine\"><div class=\"ico\"><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><defs><linearGradient id=\"gMe\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#65d2ff\"/><stop offset=\"1\" stop-color=\"#2379e8\"/></linearGradient></defs><circle cx=\"24\" cy=\"15\" r=\"8.5\" fill=\"url(#gMe)\"/><path d=\"M9 41c1.5-10 7-15 15-15s13.5 5 15 15z\" fill=\"url(#gMe)\"/></svg></div>我的</button>\n</nav>\n<div id=\"modal\" class=\"modal\"><div class=\"sheet\"><button class=\"close\" id=\"closeBtn\">关闭</button><div id=\"detail\"></div></div></div>"</script>

<script>
let items=[],page='home',query='',audioEl=null,deferredInstallPrompt=null,todayFilter='all',statusFilter='mastered',lastDateKey='';
const KEY='dceng_v9_progress';
const LOCAL_AUDIO_BASE='./audio/';
const LOCAL_EXAMPLE_BASE='./example_audio/';
function audioSlug(w){return String(w).toLowerCase().replace(/[^a-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'');}
const progress=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('dceng_v8_progress')||localStorage.getItem('dceng_v6_progress')||'{}');
if(localStorage.getItem('dceng_dict_cache_version')!=='156'){localStorage.removeItem('dceng_dict_cache_v151');localStorage.setItem('dceng_dict_cache_version','157');}
const favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]'));
const CUSTOM_KEY='dceng_custom_words_v1';
let customItems=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]');
function saveCustomItems(){localStorage.setItem(CUSTOM_KEY,JSON.stringify(customItems))}
function normalizeWord(w){return String(w||'').trim().toLowerCase()}
function mergeCustomItems(){
  const baseWords=new Set(items.map(x=>normalizeWord(x.word)));
  customItems=customItems.filter(x=>x&&normalizeWord(x.word)&&!baseWords.has(normalizeWord(x.word)));
  items=[...items,...customItems];
}
function findWord(w){const k=normalizeWord(w);return items.find(x=>normalizeWord(x.word)===k)}


function $id(x){return document.getElementById(x)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem('favs',JSON.stringify([...favs]))}
function today(){return new Date().toLocaleDateString('en-CA')}
function greeting(){const h=new Date().getHours();if(h>=5&&h<12)return 'Good morning ☀️';if(h>=12&&h<18)return 'Good afternoon ☀️';return 'Good evening 🌙'}
function st(w){return progress[w]||{box:0,due:0,seen:0,correct:0,wrong:0,last:0}}
function isPro(x){return x.category==='Data Center & Electrical Engineering'||x.category==='Engineering Phrases'||x.category==='Scenario'}
function uniqueByWord(pool){const seen=new Set(),out=[];for(const x of pool){const k=String(x.word||'').trim().toLowerCase();if(!k||seen.has(k))continue;seen.add(k);out.push(x)}return out}
function due(){return uniqueByWord(items.filter(x=>{let s=st(x.word);return s.seen>0&&s.due<=Date.now()}))}
function mastered(){return uniqueByWord(items.filter(x=>{let s=st(x.word);return s.box>=4&&s.due>Date.now()}))}
function learning(){return uniqueByWord(items.filter(x=>{let s=st(x.word);return s.seen>0&&s.box<4&&s.due>Date.now()}))}
function newWords(pool=items){return uniqueByWord(pool).filter(x=>st(x.word).seen===0)}
function statusPool(mode){if(mode==='mastered')return mastered();if(mode==='learning')return learning();if(mode==='due')return due();return []}
function openStatus(mode){statusFilter=mode;page='status';query='';render();window.scrollTo({top:0,behavior:'instant'})}
function goals(){const rv=localStorage.getItem('dceng_review')||'20';return{
  n:localStorage.getItem('dceng_daily_new')===null?20:+localStorage.getItem('dceng_daily_new'),
  p:localStorage.getItem('dceng_daily_pro')===null?10:+localStorage.getItem('dceng_daily_pro'),
  r:rv==='all'?Infinity:(+rv||20)
}}
function dayStats(){return JSON.parse(localStorage.getItem('dceng_daystats')||'{}')}
function setDayStats(o){localStorage.setItem('dceng_daystats',JSON.stringify(o))}
function completedToday(){return dayStats()[today()]||{n:0,p:0,r:0}}
function markToday(type,w){
  let all=dayStats(),k=today(); all[k]=all[k]||{n:0,p:0,r:0};
  all[k][type]=all[k][type]||0; all[k][type]++; setDayStats(all);
  let done=JSON.parse(localStorage.getItem('dceng_completed_today')||'{}');
  done[k]=done[k]||{}; done[k][w]=true; localStorage.setItem('dceng_completed_today',JSON.stringify(done));
}
function isCompletedToday(w){let d=JSON.parse(localStorage.getItem('dceng_completed_today')||'{}');return !!(d[today()]&&d[today()][w])}
function streak(){
  let d=JSON.parse(localStorage.getItem('dceng_days')||'{}'),n=0,dt=new Date();
  for(let i=0;i<3660;i++){let k=dt.toLocaleDateString('en-CA');if(!d[k])break;n++;dt.setDate(dt.getDate()-1)}
  return n
}
function markDay(){let d=JSON.parse(localStorage.getItem('dceng_days')||'{}');d[today()]=true;localStorage.setItem('dceng_days',JSON.stringify(d))}
function familyKey(x){
  if(x && x.family)return String(x.family).toLowerCase();
  const w=String(x.word||'').trim().toLowerCase();
  const root=String(x.root||'').trim().toLowerCase();
  if(root==='pose')return 'pose-family';
  const explicit={
    'action':'act','activity':'act','actuator':'act',
    'protection':'protect','protective':'protect',
    'excitation':'excite','exciter':'excite',
    'overvoltage':'voltage','undervoltage':'voltage',
    'operation':'operate','operator':'operate','operate':'operate',
    'synchronization':'synchronize','synchronizer':'synchronize',
    'regulation':'regulate','regulator':'regulate',
    'inspection':'inspect','reinspection':'inspect',
    'rectifier':'rectify','rectification':'rectify',
    'ability':'able','confirm':'confirm','connect':'connect','failure':'fail',
    'maintain':'maintain','prevent':'prevent','replace':'replace','safe':'safe',
    'verify':'verify','appoint':'appoint','arrive':'arrive','communicate':'communicate',
    'decide':'decide','discuss':'discuss','environment':'environment','instruct':'instruct',
    'solve':'solve','supervise':'supervise','equip':'equip','isolate':'isolate',
    'alternate':'alternate','charge':'charge','manage':'manage','break':'break',
    'bus':'bus','earth':'earth','resist':'resist','electric':'electric','feed':'feed','charge':'charge','recharge':'charge','discharge':'charge','overcharge':'charge','load':'load','overload':'load','reload':'load','unload':'load','power':'power','powered':'power','powerful':'power','powerless':'power','approve':'approve','disapprove':'approve','test':'test','retest':'test','testing':'test','tester':'test','configure':'configure','configuration':'configure','reconfigure':'configure','respond':'respond','response':'respond','responsive':'respond','depend':'depend','dependent':'depend','dependence':'depend','independent':'depend','independence':'depend','prepare':'prepare','preparation':'prepare','unprepared':'prepare','safe':'safe','unsafe':'safe','safely':'safe','effective':'effect','ineffective':'effect','effectively':'effect','active':'active','activate':'active','inactive':'active','deactivate':'active','direct':'direct','direction':'direct','indirect':'direct','possible':'possible','impossible':'possible','possibility':'possible','necessary':'necessary','unnecessary':'necessary','regular':'regular','irregular':'regular','regularly':'regular'
  };
  if(explicit[w])return 'root:'+explicit[w];
  if(root && /^[a-z][a-z-]{2,20}$/.test(root))return 'root:'+root.replace(/-$/,'');
  return 'single:'+x.id;
}
function seededHash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function groupedNewWords(pool,limit){
  const unseen=uniqueByWord(pool).filter(x=>st(x.word).seen===0);
  const groups=new Map();
  unseen.forEach(x=>{const k=familyKey(x);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});
  const multi=[],single=[];
  for(const [k,arr] of groups){
    arr.sort((a,b)=>seededHash(a.word+today())-seededHash(b.word+today()));
    (arr.length>1?multi:single).push({k,arr});
  }
  const seed=today()+':'+pool.length;
  multi.sort((a,b)=>{const sa=seededHash(seed+a.k),sb=seededHash(seed+b.k);return (b.arr.length-a.arr.length)||(sa-sb)});
  single.sort((a,b)=>seededHash(seed+a.k)-seededHash(seed+b.k));
  const ordered=[...multi,...single];
  const out=[];
  for(const g of ordered){
    if(out.length>=limit)break;
    const remain=limit-out.length;
    if(g.arr.length<=remain){out.push(...g.arr)}
    else {out.push(...g.arr.slice(0,remain));break}
  }
  return out;
}
function dailyPlan(){
  const g=goals(), key='dceng_plan_v164_'+today();
  let saved=JSON.parse(localStorage.getItem(key)||'null');
  if(saved && Array.isArray(saved.ids)) return saved;
  const dailyPool=groupedNewWords(items.filter(x=>!isPro(x)),g.n);
  const dailyIds=new Set(dailyPool.map(x=>x.id));
  const proPool=groupedNewWords(items.filter(isPro).filter(x=>!dailyIds.has(x.id)),g.p);
  const plan={ids:[...dailyPool,...proPool].map(x=>x.id)};
  localStorage.setItem(key,JSON.stringify(plan)); return plan;
}
function todayTasks(){
  const ids=new Set(dailyPlan().ids);
  return items.filter(x=>ids.has(x.id));
}
function todayRemaining(){return todayTasks().filter(x=>!isCompletedToday(x.word))}
function preloadTodayAudio(){}
function todayCounts(){
  const t=completedToday(),g=goals();
  return {n:t.n,p:t.p,r:0,total:t.n+t.p,target:g.n+g.p}
}
function refreshStats(){
  let m=mastered().length,p=items.length?Math.round(m/items.length*100):0;
  $id('total')?.replaceChildren(items.length);$id('mastered')?.replaceChildren(m);
  $id('due')?.replaceChildren(due().length);$id('streak')?.replaceChildren(streak());
  $id('pct')?.replaceChildren(p+'%');if($id('bar'))$id('bar').style.width=p+'%';
}
function statusLabel(x){
  if(isCompletedToday(x.word)) return '<span class="badge done">今日已完成</span>';
  let s=st(x.word); if(s.seen===0)return '<span class="badge">新词</span>';
  if(s.due<=Date.now())return '<span class="badge duebadge">待复习</span>';
  return '<span class="badge">学习中</span>';
}
function cachedEntry(word){
  const x=items.find(a=>String(a.word).toLowerCase()===String(word).toLowerCase());
  if(!x)return null;
  return {meaning_zh:x.meaning_zh||'',pos:x.pos||'',phonetic:x.phonetic||'',example_en:x.example_en||'',example_zh:x.example_zh||'',collocations:x.collocations||[],source:'本地离线词库'};
}
function familyLabel(x){
  if(page!=='today'||!x||!x.family)return '';
  const k=String(x.family).toLowerCase();
  const n=items.filter(y=>String(y.family||'').toLowerCase()===k&&st(y.word).seen===0).length;
  return n>1?`<span class="familyTag">关联组 · ${esc(x.family)}</span>`:'';
}
function associationBlock(x){
  if(!x)return '';
  const types=Array.isArray(x.association_types)?x.association_types:[];
  const rel=Array.isArray(x.related_words)?x.related_words.filter(Boolean):[];
  const scenes=Array.isArray(x.scene_groups)?x.scene_groups:[];
  if(!types.length&&!rel.length&&!scenes.length)return '';
  const typeText=types.join(' · ');
  const relText=rel.slice(0,14).join(' · ');
  const sceneText=scenes.join(' · ');
  return `<div class="assocBox"><b>关联记忆</b>${typeText?`<div class="small">类型：${esc(typeText)}</div>`:''}${x.family?`<div>词族：<b>${esc(x.family)}</b></div>`:''}${sceneText?`<div>工程场景：${esc(sceneText)}</div>`:''}${relText?`<div>相关词：${esc(relText)}</div>`:''}</div>`;
}
function card(x,i){
  const c=cachedEntry(x.word);
  const meaning=c?.meaning_zh||x.meaning_zh||'—';
  const ex=c?.example_en||x.example_en||'—';
  const tr=c?.example_zh||x.example_zh||'';
  return `<article class="card" data-detail-word="${esc(x.word)}">
    <div class="top"><div><div class="word">${esc(x.word)}</div><div class="cn">${esc(meaning)}</div></div>
    <button class="speak" data-speak="${i}">🔊</button></div>
    <div class="ex">${esc(ex)}</div><div class="tr">${esc(tr)}</div>
    <span class="tag">${isPro(x)?'Professional Engineering':'Daily & Work English'} · ${x.quality==='offline-local'?'本地词库':x.quality} · ${statusLabel(x)} ${familyLabel(x)}</span>
  </article>`
}
const LIST_PAGE_SIZE=60;
let listState={pool:[],shown:0,container:null,button:null};
function initLazyList(pool){
  const arr=Array.isArray(pool)?pool.slice():[];
  arr.sort((a,b)=>{const sa=st(a.word),sb=st(b.word);const la=sa.seen>0?1:0,lb=sb.seen>0?1:0;if(la!==lb)return la-lb;if(la===1)return (sa.last||0)-(sb.last||0);return 0;});
  listState={pool:arr,shown:0,container:$id('cards'),button:$id('loadMore')};
  if(!listState.container)return;
  listState.container.innerHTML='';
  appendLazyList();
}
function appendLazyList(){
  const start=listState.shown,end=Math.min(start+LIST_PAGE_SIZE,listState.pool.length);
  if(!listState.container)return;
  const html=listState.pool.slice(start,end).map(x=>card(x,items.indexOf(x))).join('');
  if(html) listState.container.insertAdjacentHTML('beforeend',html);
  listState.shown=end;
  if(listState.button){
    listState.button.textContent=listState.shown<listState.pool.length?`加载更多（${listState.shown}/${listState.pool.length}）`:`已全部加载（${listState.pool.length}）`;
    listState.button.style.display=listState.shown<listState.pool.length?'block':'none';
  }
}
function listShell(){return '<div id="cards"></div><button id="loadMore" class="cta blue" style="margin-top:12px;display:none">加载更多</button>'}

function openToday(mode='all'){
  todayFilter = (mode==='review') ? 'all' : (mode || 'all');
  page = 'today';
  query = '';
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderToday(mode='all'){
 const g=goals(), tasks=todayTasks();
 let pool=tasks;
 if(mode==='daily') pool=tasks.filter(x=>!isPro(x)&&st(x.word).seen===0);
 if(mode==='professional') pool=tasks.filter(x=>isPro(x)&&st(x.word).seen===0);
 page='today';
 $id('main').innerHTML=`<div class="hero"><h2>今日学习</h2><p>按关联记忆组学习 · 一个核心词带动前后缀变化 · 相关词尽量连续学习</p>
 <div class="taskgrid twoTasks"><div class="task">${taskIcon('daily','todayDaily')}<b>${completedToday().n}/${g.n}</b><span>日常新词</span></div><div class="task">${taskIcon('professional','todayPro')}<b>${completedToday().p}/${g.p}</b><span>专业新词</span></div></div>
 <div class="tabs"><button class="${mode==='all'?'active':''}" data-tmode="all">全部</button><button class="${mode==='daily'?'active':''}" data-tmode="daily">日常</button><button class="${mode==='professional'?'active':''}" data-tmode="professional">专业</button></div>
 ${listShell()}</div>`;
 document.querySelectorAll('[data-tmode]').forEach(b=>b.onclick=()=>renderToday(b.dataset.tmode));
 initLazyList(pool);
 document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{let x=items[+b.dataset.speak];playLocalWord(x.word)});
 document.querySelectorAll('[data-detail-word]').forEach(b=>b.onclick=()=>detailByWord(b.dataset.detailWord));
}

function taskIcon(type,uid){
 const id=String(uid||type).replace(/[^a-z0-9]/gi,'');
 if(type==='daily') return `<svg class="taskIcon" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tb${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4da7ff"/><stop offset="1" stop-color="#1d69e8"/></linearGradient><linearGradient id="tg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#45d9ad"/><stop offset="1" stop-color="#17a978"/></linearGradient></defs><path d="m8 16 25-7 7 17-25 7z" fill="url(#tb${id})"/><path d="M9 16.5 33 10l3 2-23 6.5z" fill="#7bc5ff" opacity=".75"/><path d="m11 29 25-7 5 13-24 7z" fill="url(#tg${id})"/><path d="M15 33.5 36 28l2 4-21 5.5z" fill="#fff" opacity=".9"/><path d="M30 39v5l4-3 4 1v-6z" fill="#ffc22b"/></svg>`;
 if(type==='professional') return `<svg class="taskIcon" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="th${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd92e"/><stop offset="1" stop-color="#f89c16"/></linearGradient></defs><path d="M9 26c0-10 7-16 15-16s15 6 15 16v7H9z" fill="url(#th${id})"/><path d="M8 32h32v5H8z" fill="#f59b12"/><path d="M24 14 18.5 25h5l-2 8L30 22h-5z" fill="#fff"/></svg>`;
 return `<svg class="taskIcon" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tr${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a99bff"/><stop offset="1" stop-color="#6552e8"/></linearGradient></defs><rect x="7" y="7" width="34" height="34" rx="9" fill="url(#tr${id})"/><path d="M13 24a11 11 0 0 1 19-7" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"/><path d="m31 13 1 7-7-1" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 24a11 11 0 0 1-19 7" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"/><path d="m17 35-1-7 7 1" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function addToReviewPlan(word){
  const x=findWord(word); if(!x)return false;
  const key=String(x.word).trim(); let s=st(key), now=Date.now();
  if(s.seen===0){s.seen=1;s.box=0;s.correct=0;s.wrong=0;}
  s.last=now; s.due=now; progress[key]=s; save();
  return true;
}
function renderDictionarySearch(){
  return `<div class="panel dictSearchBox">
    <b>单词检索</b><div class="dictHint">同时检索日常英语 + 专业工程英语。词库已有单词直接沿用原词条和复习机制；词库没有的可以手动添加。</div>
    <div class="dictSearchRow"><input id="dictSearch" class="search" autocomplete="off" placeholder="输入英文单词 / 中文释义，例如 transformer"><button id="dictSearchBtn" class="dictSearchBtn">检索</button></div>
    <div id="dictResult" class="dictResult"></div>
  </div>`;
}
function runDictionarySearch(){
  const input=$id('dictSearch'), out=$id('dictResult'); if(!input||!out)return;
  const q=input.value.trim(), k=normalizeWord(q);
  if(!k){out.innerHTML='<div class="panel">请输入要检索的单词或中文释义。</div>';return;}

function playSpeech(text,label){

    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text||''));
      u.lang=localStorage.getItem('dceng_accent')||'en-US';
      u.rate=+(localStorage.getItem('dceng_rate')||1);
      u.onend=()=>resolve(true); u.onerror=()=>reject(new Error('tts'));
      window.speechSynthesis.speak(u);
    }catch(e){reject(e)}
  });
}

  s.seen++;s.last=now;
  if(l==='again'){s.box=0;s.wrong++;s.due=now+10*60000}
  else if(l==='hard'){s.box=Math.max(1,s.box);s.wrong++;s.due=nextMidnight(1)}
  else if(l==='good'){s.box=Math.min(4,s.box+1);s.correct++;s.due=nextMidnight(3)}
  else{s.box=4;s.correct++;s.due=nextMidnight(7)}
  progress[w]=s;save();markDay();
  if(!isCompletedToday(w)) markToday(wasDue?'r':isPro(x)?'p':'n',w);
  $id('modal').classList.remove('show');render();
}
let midnightTimer=null;
function refreshForDateChange(){
  const k=today();
  if(!lastDateKey){lastDateKey=k;return;}
  if(k!==lastDateKey){lastDateKey=k;query='';render();}
}
function scheduleMidnightRefresh(){
  if(midnightTimer) clearTimeout(midnightTimer);
  const now=new Date(), next=new Date(now);
  next.setHours(24,0,0,200);
  midnightTimer=setTimeout(()=>{refreshForDateChange();render();scheduleMidnightRefresh()},Math.max(1000,next-now));
}
let greetingTimer=null;
function scheduleGreetingRefresh(){
  if(greetingTimer) clearTimeout(greetingTimer);
  const now=new Date(), next=new Date(now), h=now.getHours();
  const hours=[5,12,18];
  const nh=hours.find(v=>v>h);
  if(nh===undefined) next.setDate(next.getDate()+1), next.setHours(5,0,0,100);
  else next.setHours(nh,0,0,100);
  greetingTimer=setTimeout(()=>{render();scheduleGreetingRefresh()},Math.max(1000,next-now));
}
window.addEventListener('focus',refreshForDateChange);
window.addEventListener('pageshow',refreshForDateChange);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshForDateChange()});
function browserSpeak(text){
  return new Promise((res,rej)=>{
    if(!('speechSynthesis'in window))return rej();
    speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);
    u.lang=localStorage.getItem('dceng_accent')||'en-US';u.rate=+(localStorage.getItem('dceng_rate')||1);
    let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));
    u.onend=()=>res();u.onerror=()=>rej();speechSynthesis.speak(u);
    setTimeout(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending)rej()},1600);
  })
}
async function speakText(t){
  // Kept only for the voice-test button; normal word/phrase playback is fully local.
  let s=$id('status'); if(s)s.textContent='正在播放系统语音…';
  try{await browserSpeak(t);if(s)s.textContent='✓ 系统语音播放中'}
  catch(e){if(s)s.textContent='✕ 系统语音不可用'}
}
async function installApp(){
  if(!deferredInstallPrompt){
    if($id('status'))$id('status').textContent='Android Chrome：如未弹出安装窗口，请打开右上角菜单 → 安装应用 / 添加到主屏幕。';
    return
  }
  deferredInstallPrompt.prompt();let c=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;
  if($id('status'))$id('status').textContent=c.outcome==='accepted'?'✓ 已开始安装':'已取消安装'
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});
window.addEventListener('appinstalled',()=>{$id('installBtn')?.classList.add('hidden')});
$id('closeBtn').onclick=()=>{$id('modal').classList.remove('show')};
$id('modal').onclick=e=>{if(e.target.id==='modal')$id('modal').classList.remove('show')};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
fetch('./vocab.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{
  items=d.entries||[];
  mergeCustomItems();
  lastDateKey=today();
  render();
  document.body.classList.add('app-ready');
  scheduleMidnightRefresh();
  scheduleGreetingRefresh();
}).catch(e=>{
  $id('main').innerHTML='<div class="panel">词库加载失败：'+esc(e.message)+'</div>';
  document.body.classList.add('app-ready');
});
